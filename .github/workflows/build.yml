name: continuous integration
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.x'
      - name: build app
        run: dotnet build src/Sonarr.sln -p:Configuration=Release -t:PublishAllRids
      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: "19"
      - name: build UI
        run: |
          yarn install
          yarn run build
      - name: copy UI
        run: |
          cp -R _output/UI _output/net6.0/linux-arm/publish
          cp -R _output/UI _output/net6.0/linux-arm64/publish
          cp -R _output/UI _output/net6.0/linux-x64/publish
      - name: upload build artifacts (linux/arm)
        uses: actions/upload-artifact@v3
        with:
          name: sonarr-hevc-linux-arm
          path: _output/net6.0/linux-arm/publish
      - name: upload build artifacts (linux/arm64)
        uses: actions/upload-artifact@v3
        with:
          name: sonarr-hevc-linux-arm64
          path: _output/net6.0/linux-arm64/publish
      - name: upload build artifacts (linux/x64)
        uses: actions/upload-artifact@v3
        with:
          name: sonarr-hevc-linux-x64
          path: _output/net6.0/linux-x64/publish
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: download build artifacts (linux/arm)
        uses: actions/download-artifact@v7
        with:
          name: sonarr-hevc-linux-arm
          path: ${{runner.temp}}/linux-arm/Sonarr
      - name: download build artifacts (linux/arm64)
        uses: actions/download-artifact@v7
        with:
          name: sonarr-hevc-linux-arm64
          path: ${{runner.temp}}/linux-arm64/Sonarr
      - name: download build artifacts (linux/x64)
        uses: actions/download-artifact@v7
        with:
          name: sonarr-hevc-linux-x64
          path: ${{runner.temp}}/linux-x64/Sonarr
      - name: prepare release asset
        shell: pwsh
        run: |
          Compress-Archive -Path ${{runner.temp}}/linux-arm/Sonarr -DestinationPath sonarr-hevc-linux-arm.zip
          Compress-Archive -Path ${{runner.temp}}/linux-arm64/Sonarr -DestinationPath sonarr-hevc-linux-arm64.zip
          Compress-Archive -Path ${{runner.temp}}/linux-x64/Sonarr -DestinationPath sonarr-hevc-linux-amd64.zip
      - name: create release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          files: |
            sonarr-hevc-linux-arm.zip
            sonarr-hevc-linux-arm64.zip
            sonarr-hevc-linux-amd64.zip
  docker:
    runs-on: ubuntu-latest
    needs: [build, release]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: setup platform emulator
        uses: docker/setup-qemu-action@v2
      - name: setup multi-arch docker build
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build & push images
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm, linux/arm64
          push: true
          tags: floriang89/sonarr-hevc:latest
